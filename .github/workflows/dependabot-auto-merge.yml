name: Dependabot Auto-merge

# Follows GitHub's recommended setup:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions
# `pull_request` (not `pull_request_target`) so the workflow never runs with write access
# on untrusted code; the permissions below are granted to Dependabot PRs explicitly.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Check the PR author, not the actor: the actor is whoever last triggered the run
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'clEsperanto/pyclesperanto'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Major updates can contain breaking changes: leave them for manual review
      - name: Approve and enable auto-merge for minor and patch updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
